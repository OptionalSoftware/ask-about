# http context. Install to /etc/nginx/conf.d/ask-about_http.conf — needed either way,
# whether ask-about gets its own server block or shares an existing one.
#
# These directives are only legal at http level, which is why they are not in
# ask-about_locations.conf.

upstream ask-about {
    server 127.0.0.1:8283;      # <- ask-about's server.addr
    keepalive 16;
}

# ask-about caps spend but not concurrency, so that lives here. 20r/m is a question
# every three seconds sustained; burst absorbs a few quick starter-prompt taps.
limit_req_zone  $binary_remote_addr zone=askabout_chat:10m rate=20r/m;
# Each answer holds a connection open while it streams.
limit_conn_zone $binary_remote_addr zone=askabout_conn:10m;
