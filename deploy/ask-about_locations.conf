# The /ask-about locations. Install to /etc/nginx/ask-about_locations.conf and add
#
#     include /etc/nginx/ask-about_locations.conf;
#
# inside the server block that should serve ask-about. Needs ask-about_http.conf in
# conf.d/ for the upstream it proxies to.
#
# Everything is nested inside one location, so the inner two inherit the proxy
# headers rather than repeating them, and nothing is set outside /ask-about — adding
# this to a site that already exists cannot change how the rest of it behaves.

# The bare path redirects to the trailing-slash one. The main block below is
# /ask-about/ rather than /ask-about on purpose: nginx prefix matching would
# otherwise capture any path that merely begins with those letters, such as
# /ask-about-us on a site this shares a domain with. Relative, so it stays
# correct behind another proxy or load balancer, and it keeps the query string.
location = /ask-about {
    absolute_redirect off;
    return 301 /ask-about/$is_args$args;
}

# Restricting the admin pages by address is admin.ip in config.toml. It reads
# X-Forwarded-For, so it sees the real client through this.
location /ask-about/ {
    proxy_pass http://ask-about;

    proxy_http_version 1.1;
    # Empty rather than "upgrade", so the upstream keepalive pool is actually
    # reused — which matters when every answer holds a connection open.
    proxy_set_header Connection "";

    proxy_set_header Host            $host;
    proxy_set_header X-Real-IP       $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    # ask-about builds absolute URLs from these — the og:url in a link preview and
    # the image beside it — and decides from them whether to mark cookies
    # Secure. Missing them fails quietly: the site works, and only the links
    # people paste into Slack come out wrong.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host  $host;

    proxy_connect_timeout 5s;

    # No cache: /ask-about/config answers differently per visitor, so a shared one
    # would hand one visitor's reply to the next.
    proxy_cache off;

    # ask-about refuses anything over 1MB itself; this rejects it a hop earlier.
    client_max_body_size 1m;

    # Scoped here rather than set at http level, so a site that already
    # configures compression keeps its own settings. text/event-stream is
    # deliberately absent, and text/javascript is what ask-about labels app.js —
    # listing only the application/ spelling leaves the largest asset
    # uncompressed. text/html is always gzipped and cannot be listed.
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css text/javascript application/javascript
                    application/json image/svg+xml;

    # The page has no inline script or style and fetches nothing off-origin,
    # so this can be as tight as it looks. 'unsafe-inline' for style is the
    # one concession: the admin pages carry their CSS inline.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;

    # --- the streaming endpoint -------------------------------------------
    #
    # Everything here exists to keep bytes moving. ask-about also sends
    # X-Accel-Buffering: no; this repeats it in case that header changes.
    location /ask-about/chat {
        proxy_pass http://ask-about;

        limit_req  zone=askabout_chat burst=5 nodelay;
        limit_conn askabout_conn 4;
        # Tell the visitor to slow down rather than that something broke.
        limit_req_status  429;
        limit_conn_status 429;

        proxy_buffering off;
        proxy_cache     off;
        # Compressing a stream buffers it, which is the one thing this must
        # not do.
        gzip            off;
        chunked_transfer_encoding on;

        # The connection is idle between sentences; a short read timeout would
        # cut the answer off mid-thought.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
